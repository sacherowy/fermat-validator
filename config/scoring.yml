# FerMat Validator — Scoring Configuration
#
# Defines maximum points per task, grouped by etap and task number range.
# Both etap1 and etap2 are REQUIRED. FerMat has no etap3.
#
# To change the scoring scale, update max_points values.
# Changes take effect on next application restart (or cache expiry).

etap1:
  task_groups:
    - tasks: [1, 2, 3, 4, 5]
      max_points: 2
    - tasks: [6, 7, 8, 9, 10]
      max_points: 4

etap2:
  task_groups:
    - tasks: [1, 2, 3, 4, 5]
      max_points: 4
